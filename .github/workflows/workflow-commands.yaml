name: Workflow Commands

on: [push]

jobs:
  testing-wf-commands:
    runs-on: windows-latest

    steps:
      - name: Error
        run: echo "::error::Missing semicolon"

      - name: Warning
        run: echo "::warning::Deprecated API"

      - name: Notice
        run: echo "::notice::Build Started"

      - name: Group Logs
        run: |
          echo "::group::Installing"
          echo "npm install"
          echo "npm test"
          echo "::endgroup::"